<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nougths and Crosses</title>
    <link rel="stylesheet" href="/assets/css/n-and-c.css">
    <link rel="shortcut icon" href="/assets/images/X n O.jpg" type="image/x-icon">
</head>
<body>

    <main class="main">
        <h1 id="turnDisplay">Player 1's turn</h1>
        <div id="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>

            <!-- Rule line -->
            <div class="line row-1"></div>
            <div class="line row-2"></div>
            <div class="line row-3"></div>
            
            <div class="line col-1"></div>
            <div class="line col-2"></div>
            <div class="line col-3"></div>
            
            <div class="line diag-1"></div>
            <div class="line diag-2"></div>
        </div>
        <button id="restartBtn" class="restart-btn">Restart Game</button> 
        <div class="scoreboard">
            <div>
                <p>Player X: <span id="scoreX">0</span></p>
                <p>Player O: <span id="scoreO">0</span></p>
            </div>
            <button id="resetScore">Reset Score</button>
        </div>
    </main>

    <script src="/assets/javascript/n-and-c.js"></script>
</body>
</html>
